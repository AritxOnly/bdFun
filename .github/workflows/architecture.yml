name: Architecture and debug
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: architecture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Install pinned Android tools
        # Runner自带新版sdkmanager，API37的包名包含次版本号。
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Prepare pinned Miuix source
        run: python3 tools/setup-miuix.py
      - name: Check architecture and compile debug
        run: bash ./gradlew checkLayering :app:assembleDebug --no-parallel --max-workers=2
      - name: Verify forbidden production dependency is rejected
        run: bash tools/check-module-graph-negative.sh --no-parallel --max-workers=2
      - name: Run core policies and video state regression tests
        run: >-
          bash ./gradlew :core:domain:test :core:application:test
          :feature:video:testDebugUnitTest
          --tests '*VideoDetailStateHolderTest'
          --tests '*VideoReadCacheTest'
          --tests '*VideoInteractionStateHolderTest'
          --tests '*VideoPlayerAssemblyTest'
          --tests '*FullscreenDanmakuComposerStateTest'
          --no-parallel --max-workers=2
